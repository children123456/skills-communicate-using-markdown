# ---------------------------------------------------
# 规则逻辑
# ---------------------------------------------------
rules:
  # 域名直连
  - DOMAIN-SUFFIX,kr.epochtx.me,DIRECT
  - DOMAIN-SUFFIX,vps.epochtx.me,DIRECT
  
  - RULE-SET,ChinaMax,DIRECT
  - RULE-SET,DouYin,国内媒体
  - RULE-SET,XiaoHongShu,国内媒体
  - RULE-SET,OpenAI,智能助理
  - RULE-SET,AppleAI,AppleAI
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Telegram,电报信息
  - RULE-SET,Instagram,Instagram
  - RULE-SET,Line,Line
  - RULE-SET,Google,谷歌服务,no-resolve
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Sony,游戏平台
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Nintendo,游戏平台
  - RULE-SET,YouTube,油管视频
  - RULE-SET,Netflix,奈飞视频
  - RULE-SET,Disney,迪士尼+
  - RULE-SET,BiliBili,哔哩哔哩
  
  # 广告屏蔽
  - DOMAIN-SUFFIX,applovin.com,REJECT
  - DOMAIN-SUFFIX,axon.ai,REJECT
  - DOMAIN-SUFFIX,appsflyer.com,REJECT

  # 兜底
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
